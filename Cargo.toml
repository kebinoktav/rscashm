[package]
name = "rscashm"
version = "0.4.0"
edition = "2024"

[dependencies]
env_logger = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
bincode = { version = "2.0.1", features = ["serde"] }
rfd = "0.17.2"
iced = { version = "0.14.0", features = ["tokio", "image"] }
serde_json = "1.0"
cryptainer = { version = "2.3", features = ["derive"] }
rand = "0.10"

[profile.release]
opt-level = 2       # optimization for speed and still has more small binary than opt-3
lto = "thin"         # Link Time Optimization across all crates
codegen-units = 1   # Slower compile, but better runtime optimization
panic = "abort"     # Removes unwinding code to reduce binary size
strip = true        # Removes debug symbols from the binary
